[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewforge"
version = "0.1.0"
description = "Timed mock interviews for software developers — heuristic answer scoring, SQLite progress tracking, weak-spot reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parth", email = "872000@users.noreply.github.com" }]
keywords = ["interview", "mock-interview", "dsa", "career", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.scripts]
interviewforge = "interviewforge.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["interviewforge*"]

[tool.setuptools.package-data]
interviewforge = ["data/*.json"]
